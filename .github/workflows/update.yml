name: update-calendars

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py calendars
      - name: commit if matches changed
        if: always()
        run: |
          git add -N calendars
          if git diff --quiet -I '^DTSTAMP:' -- calendars; then
            git checkout -- calendars 2>/dev/null || true
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add calendars
          git commit -m "update calendars"
          git push
